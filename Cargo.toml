[workspace]
resolver = "3"
members = [
    "crates/sameboy-sys",
    "crates/core",
    "crates/sameboy",
    "crates/engine",
    "crates/protocol",
    "crates/bundle",
    "crates/server",
    "crates/cli",
    "crates/gbcli",
    "crates/corpus",
    "crates/view",
    "crates/audio",
    "crates/build",
    "crates/music",
    "crates/pixels",
    "crates/flash",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gbcli-core = { path = "crates/core" }
gbcli-engine = { path = "crates/engine" }
gbcli-sameboy = { path = "crates/sameboy" }
gbcli-protocol = { path = "crates/protocol" }
gbcli-bundle = { path = "crates/bundle" }
gbcli-server = { path = "crates/server" }
gbcli-cli = { path = "crates/cli" }
gbcli-view = { path = "crates/view" }
gbcli-audio = { path = "crates/audio" }
gbcli-build = { path = "crates/build" }
gbcli-music = { path = "crates/music" }
gbcli-pixels = { path = "crates/pixels" }
gbcli-flash = { path = "crates/flash" }
sameboy-sys = { path = "crates/sameboy-sys" }
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
lexopt = "0.3"

# Every crate but the two SameBoy crates opts in with `[lints] workspace =
# true`, so `unsafe` stays confined to the FFI boundary, where it is reviewed.
[workspace.lints.rust]
unsafe_code = "forbid"

# The tests drive an emulator for thousands of frames, and debug-build Rust
# made the warm suite 3x slower (38 s of CPU against 12.5 s). opt-level 1
# keeps incremental rebuilds the same and costs about 6 s on a clean build;
# see project/2026-11-06-test-suite-speed.md. Debug info and assertions stay.
[profile.dev]
opt-level = 1
