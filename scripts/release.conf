# How homebrew-tap's scripts/release publishes gbcli; its --help lists the keys.
formula=gbcli
name=gbcli
version_file=Cargo.toml
version_line=version = "%s"
# Every crate's entry in the lock repeats the version; the check's cargo build refreshes it.
version_also=Cargo.lock
check=scripts/hooks/pre-commit
bottle=yes
