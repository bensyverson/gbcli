[workspace]
resolver = "3"
members = [
    "crates/sameboy-sys",
    "crates/core",
    "crates/sameboy",
    "crates/engine",
    "crates/protocol",
    "crates/gbcli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gbcli-core = { path = "crates/core" }
gbcli-engine = { path = "crates/engine" }
gbcli-sameboy = { path = "crates/sameboy" }
gbcli-protocol = { path = "crates/protocol" }
sameboy-sys = { path = "crates/sameboy-sys" }
cc = "1"
serde_json = "1"
