[workspace]
resolver = "3"
members = [
    "crates/sameboy-sys",
    "crates/core",
    "crates/sameboy",
    "crates/engine",
    "crates/protocol",
    "crates/bundle",
    "crates/server",
    "crates/gbcli",
    "crates/corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gbcli-core = { path = "crates/core" }
gbcli-engine = { path = "crates/engine" }
gbcli-sameboy = { path = "crates/sameboy" }
gbcli-protocol = { path = "crates/protocol" }
gbcli-bundle = { path = "crates/bundle" }
gbcli-server = { path = "crates/server" }
sameboy-sys = { path = "crates/sameboy-sys" }
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
lexopt = "0.3"
